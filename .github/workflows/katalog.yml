name: Katalog görselleri

on:
  schedule:
    - cron: "0 0 * * *"      # her gece 03:00 (Türkiye saati)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma

permissions:
  contents: write             # aylık canlılık işareti için
  pages: write
  id-token: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      # Önceki gecenin görselleri ve kaynak fotoğraflar: yalnızca değişen ürünler yeniden üretilir
      - uses: actions/cache/restore@v4
        with:
          path: |
            cache
            site
          key: katalog-${{ github.run_id }}
          restore-keys: katalog-

      - name: Görselleri üret
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python src/pipeline.py

      - uses: actions/cache/save@v4
        with:
          path: |
            cache
            site
          key: katalog-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub, 60 gün değişiklik olmayan depolarda zamanlanmış işleri durdurur; ayda bir küçük bir işaret bırakıyoruz.
      - name: Aylık canlılık işareti
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%d > .canli
            git config user.name "katalog-bot"
            git config user.email "katalog-bot@users.noreply.github.com"
            git add .canli && git commit -m "Aylık canlılık işareti" && git push || true
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
